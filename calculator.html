<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="site-nav">
      <a href="counter.html">Counter</a>
      <a href="shopping-list.html">Shopping List</a>
      <a href="calculator.html" aria-current="page">Calculator</a>
    </nav>

    <main>
      <div class="card">
        <h1>Calculator</h1>

        <div class="calculator">
          <div class="display" aria-live="polite">
            <div id="expression" class="display-expression"></div>
            <div id="value" class="display-value">0</div>
          </div>

          <!-- The buttons are generated in calculator.js -->
          <div id="keys" class="keys"></div>

          <p class="hint">Keyboard works too: 0-9, + - * /, Enter, Backspace, Esc</p>
        </div>
      </div>
    </main>

    <script src="calculator.js"></script>
  </body>
</html>
